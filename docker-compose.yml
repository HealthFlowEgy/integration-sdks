version: '3.8'

services:
  # Mock HCX Gateway Server
  mock-hcx-server:
    image: mockserver/mockserver:latest
    container_name: hcx-mock-server
    ports:
      - "1080:1080"
      - "1090:1090"
    environment:
      MOCKSERVER_PROPERTY_FILE: /config/mockserver.properties
      MOCKSERVER_INITIALIZATION_JSON_PATH: /config/mock-expectations.json
      MOCKSERVER_LOG_LEVEL: INFO
    volumes:
      - ./tests/integration/mock-config:/config
    networks:
      - hcx-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL for testing
  postgres:
    image: postgres:15-alpine
    container_name: hcx-postgres
    environment:
      POSTGRES_DB: hcx_test
      POSTGRES_USER: hcx_user
      POSTGRES_PASSWORD: hcx_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./tests/integration/db-init:/docker-entrypoint-initdb.d
    networks:
      - hcx-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hcx_user -d hcx_test"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: hcx-redis
    ports:
      - "6379:6379"
    networks:
      - hcx-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Node.js SDK Development Container
  nodejs-dev:
    build:
      context: ./javascript
      dockerfile: Dockerfile.dev
    container_name: hcx-nodejs-dev
    volumes:
      - ./javascript:/app
      - /app/node_modules
    environment:
      HCX_AUTH_BASE_URL: http://mock-hcx-server:1080/auth
      HCX_PROTOCOL_BASE_URL: http://mock-hcx-server:1080/v0.9
      NODE_ENV: development
    depends_on:
      mock-hcx-server:
        condition: service_healthy
    networks:
      - hcx-network
    command: npm run dev

  # Python SDK Development Container
  python-dev:
    build:
      context: ./python/hcx-integrator
      dockerfile: Dockerfile.dev
    container_name: hcx-python-dev
    volumes:
      - ./python/hcx-integrator:/app
    environment:
      HCX_AUTH_BASE_URL: http://mock-hcx-server:1080/auth
      HCX_PROTOCOL_BASE_URL: http://mock-hcx-server:1080/v0.9
      PYTHONUNBUFFERED: 1
    depends_on:
      mock-hcx-server:
        condition: service_healthy
    networks:
      - hcx-network
    command: python -m pytest --watch

  # Java SDK Development Container
  java-dev:
    build:
      context: ./java/hcx-integrator-sdk
      dockerfile: Dockerfile.dev
    container_name: hcx-java-dev
    volumes:
      - ./java/hcx-integrator-sdk:/app
      - maven-cache:/root/.m2
    environment:
      HCX_AUTH_BASE_URL: http://mock-hcx-server:1080/auth
      HCX_PROTOCOL_BASE_URL: http://mock-hcx-server:1080/v0.9
    depends_on:
      mock-hcx-server:
        condition: service_healthy
    networks:
      - hcx-network
    command: mvn spring-boot:run

  # .NET SDK Development Container
  dotnet-dev:
    build:
      context: ./dot-net
      dockerfile: Dockerfile.dev
    container_name: hcx-dotnet-dev
    volumes:
      - ./dot-net:/app
      - nuget-cache:/root/.nuget/packages
    environment:
      HCX_AUTH_BASE_URL: http://mock-hcx-server:1080/auth
      HCX_PROTOCOL_BASE_URL: http://mock-hcx-server:1080/v0.9
      ASPNETCORE_ENVIRONMENT: Development
    depends_on:
      mock-hcx-server:
        condition: service_healthy
    networks:
      - hcx-network
    command: dotnet watch run

  # Documentation Server
  docs:
    image: nginx:alpine
    container_name: hcx-docs
    ports:
      - "8080:80"
    volumes:
      - ./docs:/usr/share/nginx/html:ro
      - ./docs/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - hcx-network

  # API Documentation (Swagger UI)
  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    container_name: hcx-swagger-ui
    ports:
      - "8081:8080"
    environment:
      SWAGGER_JSON: /docs/openapi.yaml
      BASE_URL: /api-docs
    volumes:
      - ./docs/api-reference:/docs
    networks:
      - hcx-network

  # Monitoring - Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: hcx-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - hcx-network

  # Monitoring - Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: hcx-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-clock-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - hcx-network

networks:
  hcx-network:
    driver: bridge

volumes:
  postgres-data:
  maven-cache:
  nuget-cache:
  prometheus-data:
  grafana-data:
