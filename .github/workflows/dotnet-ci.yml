name: .NET SDK CI/CD

on:
  push:
    branches:
      - main
      - develop
      - sprint-*
    paths:
      - 'dot-net/**'
      - '.github/workflows/dotnet-ci.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'dot-net/**'
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '7.0.x'

      - name: Restore dependencies
        working-directory: dot-net
        run: dotnet restore

      - name: Format check
        working-directory: dot-net
        run: dotnet format --verify-no-changes --verbosity diagnostic
        continue-on-error: true

  test:
    name: Test (.NET ${{ matrix.dotnet-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version: ['6.0.x', '7.0.x', '8.0.x']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Restore dependencies
        working-directory: dot-net
        run: dotnet restore

      - name: Build
        working-directory: dot-net
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        working-directory: dot-net
        run: dotnet test --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage"

      - name: Upload coverage to Codecov
        if: matrix.dotnet-version == '7.0.x'
        uses: codecov/codecov-action@v3
        with:
          files: ./dot-net/**/coverage.cobertura.xml
          flags: dotnet
          name: dotnet-sdk

  build:
    name: Build & Package
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '7.0.x'

      - name: Restore dependencies
        working-directory: dot-net
        run: dotnet restore

      - name: Build
        working-directory: dot-net
        run: dotnet build --no-restore --configuration Release

      - name: Pack NuGet package
        working-directory: dot-net
        run: dotnet pack --no-build --configuration Release --output ./nupkg

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: dotnet-sdk-nupkg
          path: dot-net/nupkg/*.nupkg
          retention-days: 7

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '7.0.x'

      - name: Restore dependencies
        working-directory: dot-net
        run: dotnet restore

      - name: Run security audit
        working-directory: dot-net
        run: dotnet list package --vulnerable --include-transitive
        continue-on-error: true

      - name: Run Snyk security scan
        uses: snyk/actions/dotnet@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=dot-net/hcx-integrator-sdk/hcx-integrator-sdk.csproj

  publish-nuget:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '7.0.x'

      - name: Restore dependencies
        working-directory: dot-net
        run: dotnet restore

      - name: Build
        working-directory: dot-net
        run: dotnet build --no-restore --configuration Release

      - name: Pack NuGet package
        working-directory: dot-net
        run: dotnet pack --no-build --configuration Release --output ./nupkg

      - name: Publish to NuGet
        working-directory: dot-net
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: dotnet-v${{ steps.package-version.outputs.version }}
          release_name: .NET SDK v${{ steps.package-version.outputs.version }}
          draft: false
          prerelease: false

  publish-github:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '7.0.x'

      - name: Restore dependencies
        working-directory: dot-net
        run: dotnet restore

      - name: Build
        working-directory: dot-net
        run: dotnet build --no-restore --configuration Release

      - name: Pack NuGet package
        working-directory: dot-net
        run: dotnet pack --no-build --configuration Release --output ./nupkg

      - name: Publish to GitHub Packages
        working-directory: dot-net
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source "https://nuget.pkg.github.com/HealthFlowEgy/index.json" --skip-duplicate
