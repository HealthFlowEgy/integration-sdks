name: Python SDK CI/CD

on:
  push:
    branches:
      - main
      - develop
      - sprint-*
    paths:
      - 'python/**'
      - '.github/workflows/python-ci.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'python/**'
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: python/hcx-integrator
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort mypy pylint

      - name: Run flake8
        working-directory: python/hcx-integrator
        run: flake8 hcxintegrator --max-line-length=120 --exclude=__pycache__
        continue-on-error: true

      - name: Check black formatting
        working-directory: python/hcx-integrator
        run: black --check hcxintegrator
        continue-on-error: true

      - name: Check import sorting
        working-directory: python/hcx-integrator
        run: isort --check-only hcxintegrator
        continue-on-error: true

      - name: Run mypy type checking
        working-directory: python/hcx-integrator
        run: mypy hcxintegrator --ignore-missing-imports
        continue-on-error: true

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: python/hcx-integrator
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov pytest-asyncio

      - name: Run tests
        working-directory: python/hcx-integrator
        run: pytest --cov=hcxintegrator --cov-report=xml --cov-report=html

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v3
        with:
          files: ./python/hcx-integrator/coverage.xml
          flags: python
          name: python-sdk

  build:
    name: Build & Validate
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine wheel setuptools

      - name: Build package
        working-directory: python/hcx-integrator
        run: python -m build

      - name: Check package
        working-directory: python/hcx-integrator
        run: twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: python-sdk-dist
          path: python/hcx-integrator/dist/
          retention-days: 7

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: python/hcx-integrator
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install safety bandit

      - name: Run safety check
        working-directory: python/hcx-integrator
        run: safety check --json
        continue-on-error: true

      - name: Run bandit security scan
        working-directory: python/hcx-integrator
        run: bandit -r hcxintegrator -f json -o bandit-report.json
        continue-on-error: true

      - name: Upload security reports
        uses: actions/upload-artifact@v3
        with:
          name: python-security-reports
          path: python/hcx-integrator/*-report.json
          retention-days: 30

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        working-directory: python/hcx-integrator
        run: python -m build

      - name: Publish to PyPI
        working-directory: python/hcx-integrator
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload dist/*

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: python-v${{ steps.package-version.outputs.version }}
          release_name: Python SDK v${{ steps.package-version.outputs.version }}
          draft: false
          prerelease: false

  publish-test-pypi:
    name: Publish to Test PyPI
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        working-directory: python/hcx-integrator
        run: python -m build

      - name: Publish to Test PyPI
        working-directory: python/hcx-integrator
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_TOKEN }}
        run: twine upload --repository testpypi dist/*
